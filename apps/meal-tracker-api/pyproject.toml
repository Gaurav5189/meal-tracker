[project]
name = "meal-tracker-api"
version = "0.1.0"
description = "Meal Tracker FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires DATABASE_URL"]
